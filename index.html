.text-white {

}

.underline {

}

}

#root {

}

body {
  margin: 0;

/*
 * Tailwind v4's Preflight no longer sets `cursor: pointer` on buttons, so
 * clickable controls fall back to the default arrow cursor. Restore the
 * pointer cursor on interactive elements so artifacts give a clear
 * "this is clickable" affordance on hover.

button:not(:disabled),
[role="button"]:not([aria-disabled="true"]),
label[for],
select:not(:disabled),
summary {
  cursor: pointer;
}

  background-color: var(--card);

  background-color: var(--primary-2);
}

.hover\:bg-red-100:hover {
  --tw-bg-opacity: 1;
  background-color: rgb(254 226 226 / var(--tw-bg-opacity, 1));
}

.hover\:text-\[var\(--text\)\]:hover {
  color: var(--text);
}

.hover\:text-red-600:hover {
  --tw-text-opacity: 1;
  color: rgb(220 38 38 / var(--tw-text-opacity, 1));
}

.hover\:opacity-90:hover {
  opacity: 0.9;
}

    padding: 1rem;
  }

  .sm\:px-6 {
    padding-left: 1.5rem;

  }

    font-size: 32px;
  }
}

  .lg\:grid-cols-7 {
