  transition-property: color, background-color, border-color, text-decoration-color, fill, stroke, opacity, box-shadow, transform, filter, backdrop-filter;
  transition-timing-function: cubic-bezier(0.4, 0, 0.2, 1);
  transition-duration: 150ms;
}

:root{
  --bg:#f8faf7;
  --surface:#ffffff;
  --surface-2:#f1f5ef;
  --border:#dbe7da;
  --border-strong:#b9ccb8;
  --text:#1b2a1c;
  --text-muted:#5d735e;
  --primary:#2f7d32;
  --primary-hover:#256428;
  --primary-soft:#e8f5e9;
  --danger:#c62828;
  --danger-soft:#fdecea;
  --warn:#f9a825;
  --warn-soft:#fff8e1;
  --ok:#2e7d32;
  --ok-soft:#e8f5e9;
  --chip:#eef4ee;
  --shadow:0 8px 32px rgba(27,42,28,0.08);
}

@media (prefers-color-scheme: dark){
  :root{
    --bg:#0f1710;
    --surface:#182319;
    --surface-2:#1e2e1f;
    --border:#2a3d2b;
    --border-strong:#3a543c;
    --text:#e8f0e8;
    --text-muted:#9ab49c;
    --primary:#66bb6a;
    --primary-hover:#81c784;
    --primary-soft:#1e3320;
    --danger:#ef5350;
    --danger-soft:#2e1a19;
    --warn:#ffca28;
    --warn-soft:#332d12;
    --ok:#81c784;
    --ok-soft:#1e3320;
    --chip:#1e2e1f;
    --shadow:0 8px 32px rgba(0,0,0,0.4);
  }
}

*{
  font-family:'Sarabun', system-ui, -apple-system, sans-serif;
}

html,body{
  margin:0;
  padding:0;
  background:var(--bg);
  color:var(--text);
}

::-webkit-scrollbar{
  height:6px;
  width:6px
}

::-webkit-scrollbar-thumb{
  background:var(--border-strong);
  border-radius:999px
}

.hover\:opacity-90:hover{
  opacity: 0.9;
}

.hover\:brightness-95:hover{
  --tw-brightness: brightness(.95);
  filter: var(--tw-blur) var(--tw-brightness) var(--tw-contrast) var(--tw-grayscale) var(--tw-hue-rotate) var(--tw-invert) var(--tw-saturate) var(--tw-sepia) var(--tw-drop-shadow);
}

@media (min-width: 768px){
  .md\:flex{
    display: flex;
  }

  .md\:w-\[260px\]{
    width: 260px;
  }

  .md\:grid-cols-2{
    grid-template-columns: repeat(2, minmax(0, 1fr));
  }

  .md\:grid-cols-4{
    grid-template-columns: repeat(4, minmax(0, 1fr));
  }

  .md\:flex-row{
    flex-direction: row;
  }

  .md\:items-center{
    align-items: center;
  }

  .md\:p-4{
    padding: 1rem;
  }

  .md\:p-6{
    padding: 1.5rem;
  }
}
